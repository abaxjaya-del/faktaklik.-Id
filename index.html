<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaktaKlik - Pusat Klarifikasi Informasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- NAVIGASI -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-xl font-black tracking-wider text-indigo-400">FAKTAKLIK</div>
            <a href="https://turnbackhoax.id" target="_blank" class="text-xs text-slate-400 hover:text-white">Data by TurnBackHoax</a>
        </div>
    </header>

    <main class="flex-grow">
        <section class="max-w-4xl mx-auto px-4 py-16 text-center">
            <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-4">Saring Sebelum Sharing.</h1>
            <p class="text-slate-400 mb-8">Data asli terupdate otomatis dari sumber kredibel.</p>
            
            <div class="bg-slate-800 p-2 rounded-2xl border border-slate-700 max-w-2xl mx-auto flex gap-2">
                <input id="searchInput" type="text" placeholder="Cari berita..." class="bg-transparent w-full px-4 text-white focus:outline-none">
            </div>
        </section>

        <section class="max-w-6xl mx-auto px-4 py-8">
            <h2 class="text-xl font-bold text-white mb-6">Update Terbaru</h2>
            <!-- Tempat Berita Asli Muncul -->
            <div id="news-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <p class="text-slate-500">Mengambil data berita... mohon tunggu sebentar.</p>
            </div>
        </section>
    </main>

    <script>
        const container = document.getElementById('news-container');
        const searchInput = document.getElementById('searchInput');

        // Mengambil data dari TurnBackHoax via API Gratis
        async function fetchBerita() {
            try {
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://turnbackhoax.id/feed');
                const data = await response.json();
                renderBerita(data.items);
            } catch (error) {
                container.innerHTML = '<p class="text-red-400">Gagal memuat berita. Coba refresh halaman.</p>';
            }
        }

        function renderBerita(items) {
            container.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-slate-800 rounded-2xl border border-slate-700 p-5 hover:border-indigo-500 transition";
                div.innerHTML = `
                    <h3 class="font-bold text-white text-base leading-snug mb-2">${item.title}</h3>
                    <p class="text-slate-400 text-xs line-clamp-3">${item.description.replace(/<[^>]*>/g, '')}</p>
                    <a href="${item.link}" target="_blank" class="mt-4 block text-indigo-400 text-xs font-semibold underline">Baca Selengkapnya</a>
                `;
                container.appendChild(div);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('#news-container > div').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });

        fetchBerita();
    </script>
</body>
</html>
